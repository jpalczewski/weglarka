name: CI

on:
  push:
    branches: [main]
    # A docs-only push to `main` builds nothing (no code changed): the whole workflow is skipped,
    # same rule as for a docs-only PR below. Tags are not affected (this workflow has none).
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "**/*.md"
      - ".gitignore"
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# A new push to the same PR supersedes the running one; runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Docs-only PRs (`docs/**`, `*.md`, `.gitignore`) do not build anything: every heavy job below is
  # gated on `changes.code`. On `main` the output is always `true`, so a push there gets the full run.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect code changes
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          echo "changed files:"; printf '%s\n' "$changed"
          code=false
          while IFS= read -r file; do
            case "$file" in
              ''|docs/*|*.md|.gitignore) ;;
              *) code=true ;;
            esac
          done <<< "$changed"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = false ]; then
            echo "docs-only change: skipping the build/test jobs"
          fi

  # The squashed commit on `main` takes the PR title, so the title must already be a Conventional
  # Commit (CLAUDE.md -> "Commity i PR-y"). Runs for every PR, including docs-only ones.
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: PR title follows Conventional Commits
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          pattern='^(feat|fix|docs|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: .+$'
          if ! printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "::error::PR title must follow Conventional Commits: <type>(<scope>): <summary>"
            printf 'got: %s\n' "$TITLE"
            echo "types: feat fix docs refactor perf test build ci chore revert"
            echo "scopes: core podman ingress api daemon cli ci docs"
            exit 1
          fi

  # Numbered identifiers (ADR numbers, runbook section letters) are a shared resource across branches:
  # a rebase that left two PRs with the same ADR number, a stale generated index or a link broken by a
  # renumber fails here in seconds. Runs for every PR, docs-only ones included.
  docs-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: ADR numbering, generated index and internal links
        run: scripts/adr.sh lint

  # fmt → clippy → test in ONE job: the toolchain is installed once and the debug `target/`
  # is shared, instead of three runners each paying for toolchain setup and a cold cache.
  # The cache is written only on main (`save-if`); PRs restore main's cache read-only.
  check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -x scripts/*.sh .github/scripts/*.sh
      - uses: ./.github/actions/rust-debug-toolchain
        with:
          shared-key: check
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Dependency guards (no C crypto in the daemon, no reqwest in the CLI)
        run: .github/scripts/check-deps.sh
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # nextest runs every test in its own process, in parallel across binaries; it does not run doc tests,
      # so those keep their own step (all empty today, but a future doc test must not be skipped silently).
      - uses: taiki-e/install-action@eaa248e7e83aa1d4f575fb2e231e8a5da93dabc3 # nextest
      - run: cargo nextest run --workspace
      - run: cargo test --workspace --doc

  # The nginx end-to-end tests, in parallel with `check`: they need only the `dump` example (weglarka-model +
  # weglarka-ingress) and Docker. The debug cache is `check`'s, restored read-only; the example is built once up
  # front so the steps below (which call `cargo run`) only reuse it.
  nginx-e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Read-only restore of the cache `check` writes (same environment, so the same key).
      - uses: ./.github/actions/rust-debug-toolchain
        with:
          shared-key: check
          save-if: false
      - run: cargo build -q -p weglarka-ingress --example dump
      # The generated nginx config must pass `nginx -t` on the image the daemon runs by default
      # (IngressConfig::default_nginx_image; docs/decisions/0006). Every config listens on the probe socket
      # (docs/decisions/0054), so its directory is mounted like the daemon does (an anonymous volume here).
      - name: nginx -t
        run: |
          set -euo pipefail
          cargo run -q -p weglarka-ingress --example dump -- nginx > "$RUNNER_TEMP/nginx.conf"
          docker run --rm -i -v /run/weglarka-probe docker.io/library/nginx:1-alpine sh -c 'cat > /tmp/n.conf && nginx -t -c /tmp/n.conf' < "$RUNNER_TEMP/nginx.conf"
      # Edge mode (issue #95): nginx owns the public web ports and terminates TLS. The same image must accept
      # the generated config with the TLS material mounted where the daemon puts it (<nginx_conf_dir>/tls),
      # and the containers below exercise redirects, the ACME webroot, TLS and the fail-closed paths.
      - name: nginx -t and edge ingress
        run: |
          set -euo pipefail
          domain=blog.example.eu
          mkdir -p "$RUNNER_TEMP/edge-certs"
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -sha256 -nodes -days 2 \
            -keyout "$RUNNER_TEMP/edge-certs/$domain.key" -out "$RUNNER_TEMP/edge-certs/$domain.crt" \
            -subj "/CN=$domain" -addext "subjectAltName=DNS:$domain"
          chmod 600 "$RUNNER_TEMP/edge-certs/$domain.key"
          WEGLARKA_DUMP_PROXY_SOCKET_DIR=/run/wg-ingress \
            cargo run -q -p weglarka-ingress --example dump -- nginx-edge "$domain" > "$RUNNER_TEMP/edge.conf"
          # `nginx -t` binds the forwarder's unix sockets, so their directory has to exist.
          mkdir -p "$RUNNER_TEMP/edge-run"
          chmod 777 "$RUNNER_TEMP/edge-run"
          docker run --rm -i -v "$RUNNER_TEMP/edge-certs:/etc/nginx/tls:ro" -v "$RUNNER_TEMP/edge-run:/run/wg-ingress" \
            -v /run/weglarka-probe \
            docker.io/library/nginx:1-alpine \
            sh -c 'cat > /tmp/n.conf && nginx -t -c /tmp/n.conf' < "$RUNNER_TEMP/edge.conf"
          .github/scripts/test-edge.sh "$RUNNER_TEMP/edge.conf" "$RUNNER_TEMP/edge-certs"
      # Static sites (ADR 0049): served from <sites>/<site>/current with a read-only mount, GET/HEAD only,
      # a prefix next to a container app on the same domain, and a deploy (one rename of `current`) taking
      # effect without an nginx reload.
      - name: Static sites
        run: |
          set -euo pipefail
          cargo run -q -p weglarka-ingress --example dump -- nginx 127.0.0.11 172.16.0.0/12 > "$RUNNER_TEMP/static.conf"
          .github/scripts/test-static.sh "$RUNNER_TEMP/static.conf"
      # Wildcard certificates (issue #97): a pair named `_wildcard.<apex>` serves the apex and one label below it.
      # nginx must accept the config and really present the wildcard for a covered domain (SNI), while a domain
      # two labels below the apex and an unknown name stay refused (fail closed).
      - name: Edge wildcard certificate
        run: |
          set -euo pipefail
          certs="$RUNNER_TEMP/edge-wildcard"
          mkdir -p "$certs"
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -sha256 -nodes -days 2 \
            -keyout "$certs/_wildcard.example.eu.key" -out "$certs/_wildcard.example.eu.crt" \
            -subj "/CN=example.eu" -addext "subjectAltName=DNS:example.eu,DNS:*.example.eu"
          chmod 600 "$certs/_wildcard.example.eu.key"
          cargo run -q -p weglarka-ingress --example dump -- nginx-edge "" example.eu > "$RUNNER_TEMP/edge-wildcard.conf"
          docker run --rm -i -v "$certs:/etc/nginx/tls:ro" -v /run/weglarka-probe docker.io/library/nginx:1-alpine \
            sh -c 'cat > /tmp/n.conf && nginx -t -c /tmp/n.conf' < "$RUNNER_TEMP/edge-wildcard.conf"
          docker run -d --name wg-edge-wildcard -p 127.0.0.1:18447:8443 \
            -v /run/weglarka-probe -v "$certs:/etc/nginx/tls:ro" -v "$RUNNER_TEMP/edge-wildcard.conf:/etc/nginx/nginx.conf:ro" \
            docker.io/library/nginx:1-alpine
          trap 'docker rm -f wg-edge-wildcard >/dev/null 2>&1 || true' EXIT
          sleep 3
          san() { # prints the SAN list of the certificate presented for SNI $1 (empty when the handshake is refused)
            openssl s_client -connect 127.0.0.1:18447 -servername "$1" </dev/null 2>/dev/null \
              | openssl x509 -noout -ext subjectAltName 2>/dev/null || true
          }
          for host in nz.example.eu blog.example.eu sse.example.eu weglarka.example.eu; do
            san "$host" | grep -q '\*\.example\.eu' || { echo "FAIL: $host is not served with the wildcard" >&2; exit 1; }
          done
          for host in www.blog.example.eu example.org; do
            [ -z "$(san "$host")" ] || { echo "FAIL: $host must not get a certificate" >&2; exit 1; }
          done
          echo "ok: wildcard served for covered domains only"
      # X-Forwarded-* from a trusted peer pass through, from an untrusted one they are overwritten (docs/decisions/0007).
      # The request peer on the published port is the Docker bridge gateway (172.17.0.1) — once trusted, once not.
      - name: Forwarded headers through nginx
        run: |
          set -euo pipefail
          cargo run -q -p weglarka-ingress --example dump -- nginx 127.0.0.11 172.16.0.0/12 > "$RUNNER_TEMP/trusted.conf"
          cargo run -q -p weglarka-ingress --example dump -- nginx 127.0.0.11 192.0.2.0/24 > "$RUNNER_TEMP/untrusted.conf"
          # Single addresses, like the daemon's default (nginx's own): the probe container's, and its neighbour's.
          cargo run -q -p weglarka-ingress --example dump -- nginx 127.0.0.11 172.29.77.200 > "$RUNNER_TEMP/peer.conf"
          cargo run -q -p weglarka-ingress --example dump -- nginx 127.0.0.11 172.29.77.201 > "$RUNNER_TEMP/neighbor.conf"
          .github/scripts/test-forwarded-headers.sh "$RUNNER_TEMP/trusted.conf" "$RUNNER_TEMP/untrusted.conf" \
            "$RUNNER_TEMP/peer.conf" "$RUNNER_TEMP/neighbor.conf"
      # Forward auth (#89, docs/decisions/0052): both modes must pass `nginx -t` without the identity provider
      # running (its upstream is a variable resolved per request), and in `behind` a stub provider drives every
      # outcome of the `auth_request` contract — redirect, deny, identity headers, exempt paths, the probe
      # socket and fail-closed behaviour.
      - name: Forward auth through nginx
        run: |
          set -euo pipefail
          cargo run -q -p weglarka-ingress --example dump -- nginx-forward 127.0.0.11 172.16.0.0/12 > "$RUNNER_TEMP/forward.conf"
          docker run --rm -i -v /run/weglarka-probe docker.io/library/nginx:1-alpine \
            sh -c 'cat > /tmp/n.conf && nginx -t -c /tmp/n.conf' < "$RUNNER_TEMP/forward.conf"
          mkdir -p "$RUNNER_TEMP/forward-certs" "$RUNNER_TEMP/forward-run"
          chmod 777 "$RUNNER_TEMP/forward-run"
          for d in panel.example.eu weglarka.example.eu; do
            openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -sha256 -nodes -days 2 \
              -keyout "$RUNNER_TEMP/forward-certs/$d.key" -out "$RUNNER_TEMP/forward-certs/$d.crt" \
              -subj "/CN=$d" -addext "subjectAltName=DNS:$d"
            chmod 600 "$RUNNER_TEMP/forward-certs/$d.key"
          done
          WEGLARKA_DUMP_PROXY_SOCKET_DIR=/run/wg-ingress \
            cargo run -q -p weglarka-ingress --example dump -- nginx-edge-forward panel.example.eu,weglarka.example.eu > "$RUNNER_TEMP/edge-forward.conf"
          docker run --rm -i -v "$RUNNER_TEMP/forward-certs:/etc/nginx/tls:ro" -v "$RUNNER_TEMP/forward-run:/run/wg-ingress" \
            -v /run/weglarka-probe docker.io/library/nginx:1-alpine \
            sh -c 'cat > /tmp/n.conf && nginx -t -c /tmp/n.conf' < "$RUNNER_TEMP/edge-forward.conf"
          .github/scripts/test-forward-auth.sh "$RUNNER_TEMP/forward.conf"
      # The two long nginx end-to-end tests run concurrently: they share nothing (own Docker network,
      # container names, host port and temp dir each), and each is dominated by an intentional wait.
      #  - Streaming responses (issue #64): with `ingress.streaming = true` an event written by the upstream
      #    reaches the client immediately and an idle stream survives the 60 s default read timeout; the same
      #    upstream without the option is held back by nginx (the negative control in the script).
      #  - Per-app request body limit (ADR 0033): 413 above the limit, success above the 64 MiB default, nothing
      #    spooled to the read-only ingress container's tmpfs, and a ~76 s upload survives the 60 s defaults.
      - name: Streaming and request body limit through nginx (concurrent)
        run: |
          set -euo pipefail
          cargo run -q -p weglarka-ingress --example dump -- nginx 127.0.0.11 172.16.0.0/12 > "$RUNNER_TEMP/streaming.conf"
          cargo run -q -p weglarka-ingress --example dump -- nginx 127.0.0.11 172.16.0.0/12 > "$RUNNER_TEMP/body-size.conf"
          .github/scripts/test-streaming.sh "$RUNNER_TEMP/streaming.conf" > "$RUNNER_TEMP/streaming.log" 2>&1 &
          stream_pid=$!
          .github/scripts/test-body-size.sh "$RUNNER_TEMP/body-size.conf" > "$RUNNER_TEMP/body-size.log" 2>&1 &
          body_pid=$!
          failed=0
          if wait "$stream_pid"; then :; else failed=1; echo "::error::test-streaming.sh failed"; fi
          if wait "$body_pid"; then :; else failed=1; echo "::error::test-body-size.sh failed"; fi
          echo "::group::test-streaming.sh"; cat "$RUNNER_TEMP/streaming.log"; echo "::endgroup::"
          echo "::group::test-body-size.sh"; cat "$RUNNER_TEMP/body-size.log"; echo "::endgroup::"
          exit "$failed"

  # Static (musl) daemon + CLI — built once and used three ways: build check, image content, and the
  # binaries run by the smoke test. PRs build the cheap `ci` profile, main the full `release` profile
  # (docs/decisions/0008).
  musl:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    env:
      PROFILE: ${{ github.event_name == 'pull_request' && 'ci' || 'release' }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - run: rustup target add x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      # Separate key per profile: the two never share artifacts. Read-only: on main the `release` entry
      # (`musl-release`) is written by the identical build in release.yml (job `binaries`), which has the
      # same RUSTFLAGS, toolchain and lockfile, so one entry serves both workflows. PRs restore `musl-ci`,
      # which `seed-ci-cache` writes.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: musl-${{ env.PROFILE }}
          save-if: false
      - run: cargo build --profile "$PROFILE" --locked --target x86_64-unknown-linux-musl -p weglarka-daemon -p weglarka-cli
      - uses: actions/upload-artifact@v4
        with:
          name: musl-bin
          path: |
            target/x86_64-unknown-linux-musl/${{ env.PROFILE }}/weglarka-daemon
            target/x86_64-unknown-linux-musl/${{ env.PROFILE }}/weglarka
          if-no-files-found: error
          retention-days: 1

  # main only: warms the `ci`-profile cache that PRs restore (the `musl` job on main builds `release`,
  # whose cache is useless to a PR). Off the critical path — nothing depends on it.
  seed-ci-cache:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - run: rustup target add x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: musl-ci
      - run: cargo build --profile ci --locked --target x86_64-unknown-linux-musl -p weglarka-daemon -p weglarka-cli

  # Integration tests with a real Podman 6.1 — decision: docs/decisions/0002-podman-in-ci.md.
  # Podman from OBS `home:alvistack` on ubuntu-24.04 (mirror of the host), set up by the local action
  # `podman-rootless`. The tests read WEGLARKA_PODMAN_SOCKET and skip themselves when it is not set.
  # They need no musl artifact, so this job starts right after `changes` instead of waiting for `musl`.
  podman-tests:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/podman-rootless
      # Read-only: the cache is written by the `check` job on main (same debug target).
      - uses: ./.github/actions/rust-debug-toolchain
        with:
          shared-key: check
          save-if: false
      # Without WEGLARKA_PODMAN_SOCKET the tests skip themselves — here the variable is set,
      # so `--nocapture` shows that nothing was skipped.
      - run: cargo test -p weglarka-podman -- --nocapture
      # The engine tests that drive the engine against this Podman (they skip without WEGLARKA_PODMAN_SOCKET).
      - run: cargo test -p weglarka-engine --test volumes --test image_save --test ingress_identity -- --nocapture
      - name: Podman service log
        if: failure()
        run: cat "$RUNNER_TEMP/podman-service.log" || true

  # Image smoke tests (docs/decisions/0006): daemon in a container, CLI over the socket, doctor, nginx.
  # The image is assembled from the exact binaries the `musl` job built (docs/decisions/0008); no compilation
  # here, so no Rust toolchain either. Two jobs run in parallel (the default and the edge scenarios), each
  # with its own Podman.
  smoke-behind:
    needs: [changes, musl]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/podman-rootless
      - uses: actions/download-artifact@v4
        with:
          name: musl-bin
          path: bin
      - name: Build the image from the prebuilt binaries
        run: |
          set -euo pipefail
          chmod +x bin/weglarka bin/weglarka-daemon
          podman build -q -t localhost/weglarka:ci -f Containerfile --build-arg BIN_SOURCE=prebuilt .
          podman images
      - name: Image smoke test
        run: .github/scripts/smoke-image.sh localhost/weglarka:ci bin/weglarka "$WEGLARKA_PODMAN_SOCKET" scripts/acceptance.sh
      - name: Image smoke test from the quadlet arguments (no runtime.socket, hardened)
        run: .github/scripts/smoke-quadlet.sh localhost/weglarka:ci bin/weglarka bin/weglarka-daemon "$WEGLARKA_PODMAN_SOCKET"
      - name: Podman service log
        if: failure()
        run: cat "$RUNNER_TEMP/podman-service.log" || true

  smoke-edge:
    needs: [changes, musl]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/podman-rootless
      - uses: actions/download-artifact@v4
        with:
          name: musl-bin
          path: bin
      - name: Build the image from the prebuilt binaries
        run: |
          set -euo pipefail
          chmod +x bin/weglarka bin/weglarka-daemon
          podman build -q -t localhost/weglarka:ci -f Containerfile --build-arg BIN_SOURCE=prebuilt .
          podman images
      # Edge mode (issue #95): the same image with `[ingress] mode = "edge"` — both web ports published,
      # TLS + ACME through nginx, no Traefik file, and a certificate change reloads nginx without a recreate.
      - name: Image smoke test in edge mode (TLS, no Traefik)
        run: .github/scripts/smoke-image.sh localhost/weglarka:ci bin/weglarka "$WEGLARKA_PODMAN_SOCKET" scripts/acceptance.sh edge
      - name: Podman service log
        if: failure()
        run: cat "$RUNNER_TEMP/podman-service.log" || true
