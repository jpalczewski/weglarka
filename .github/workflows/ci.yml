name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# A new push to the same PR supersedes the running one; runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # fmt → clippy → test → nginx -t in ONE job: the toolchain is installed once and the debug `target/`
  # is shared, instead of four runners each paying for toolchain setup and a cold cache.
  # The cache is written only on main (`save-if`); PRs restore main's cache read-only.
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -x scripts/*.sh .github/scripts/*.sh
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: check
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # The generated nginx config must pass `nginx -t` on the image the daemon runs by default
      # (IngressConfig::default_nginx_image; docs/decisions/0006).
      - name: nginx -t
        run: |
          set -euo pipefail
          cargo run -q -p weglarka-ingress --example dump -- nginx > "$RUNNER_TEMP/nginx.conf"
          docker run --rm -i docker.io/library/nginx:1-alpine sh -c 'cat > /tmp/n.conf && nginx -t -c /tmp/n.conf' < "$RUNNER_TEMP/nginx.conf"
      # X-Forwarded-* from a trusted peer pass through, from an untrusted one they are overwritten (docs/decisions/0007).
      # The request peer on the published port is the Docker bridge gateway (172.17.0.1) — once trusted, once not.
      - name: Forwarded headers through nginx
        run: |
          set -euo pipefail
          cargo run -q -p weglarka-ingress --example dump -- nginx 127.0.0.11 172.16.0.0/12 > "$RUNNER_TEMP/trusted.conf"
          cargo run -q -p weglarka-ingress --example dump -- nginx 127.0.0.11 192.0.2.0/24 > "$RUNNER_TEMP/untrusted.conf"
          .github/scripts/test-forwarded-headers.sh "$RUNNER_TEMP/trusted.conf" "$RUNNER_TEMP/untrusted.conf"

  # Static (musl) daemon + CLI — built once and used three ways: build check, image content, and the
  # binaries run by the smoke test. PRs build the cheap `ci` profile, main the full `release` profile
  # (docs/decisions/0008).
  musl:
    runs-on: ubuntu-24.04
    env:
      PROFILE: ${{ github.event_name == 'pull_request' && 'ci' || 'release' }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - run: rustup target add x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      # Separate key per profile: the two never share artifacts.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: musl-${{ env.PROFILE }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --profile "$PROFILE" --locked --target x86_64-unknown-linux-musl -p weglarka-daemon -p weglarka-cli
      - uses: actions/upload-artifact@v4
        with:
          name: musl-bin
          path: |
            target/x86_64-unknown-linux-musl/${{ env.PROFILE }}/weglarka-daemon
            target/x86_64-unknown-linux-musl/${{ env.PROFILE }}/weglarka
          if-no-files-found: error
          retention-days: 1

  # main only: warms the `ci`-profile cache that PRs restore (the `musl` job on main builds `release`,
  # whose cache is useless to a PR). Off the critical path — nothing depends on it.
  seed-ci-cache:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - run: rustup target add x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: musl-ci
      - run: cargo build --profile ci --locked --target x86_64-unknown-linux-musl -p weglarka-daemon -p weglarka-cli

  # Integration tests with a real Podman 6.1 — decision: docs/decisions/0002-podman-in-ci.md.
  # Podman from OBS `home:alvistack` on ubuntu-24.04 (mirror of the host). The tests (session a) read
  # WEGLARKA_PODMAN_SOCKET and skip themselves when the variable is not set.
  integration-podman:
    runs-on: ubuntu-24.04
    needs: musl
    steps:
      - uses: actions/checkout@v4
      - name: Add the alvistack repository
        run: |
          set -euo pipefail
          base="https://downloadcontent.opensuse.org/repositories/home:/alvistack/xUbuntu_24.04"
          curl -fsSL "$base/Release.key" | sudo gpg --dearmor -o /usr/share/keyrings/alvistack.gpg
          echo "deb [signed-by=/usr/share/keyrings/alvistack.gpg] $base/ /" \
            | sudo tee /etc/apt/sources.list.d/alvistack.list
          # Pinning: the Podman stack only from alvistack (as on the `niechybnie` host).
          sudo tee /etc/apt/preferences.d/alvistack >/dev/null <<'PIN'
          Package: podman* netavark* aardvark-dns* conmon* crun* passt* buildah* skopeo* containers-common* golang-github-containers-*
          Pin: origin downloadcontent.opensuse.org
          Pin-Priority: 1001
          PIN
          # The runner ships Podman 4.9 from Ubuntu; its golang-github-containers-common collides on files
          # (/etc/containers/policy.json) with containers-common from alvistack.
          sudo apt-get purge -y podman buildah skopeo crun conmon \
            golang-github-containers-common golang-github-containers-image || true
          # download.opensuse.org redirects to mirrors with stale files ("unexpected size");
          # downloadcontent.opensuse.org has no mirrors. Retries just in case.
          for attempt in 1 2 3 4; do
            sudo apt-get update && break
            [ "$attempt" = 4 ] && exit 1
            sleep 15
          done
      # The cache key is the candidate versions of the packages we install, so a new alvistack build
      # misses the cache and downloads fresh .debs; an empty/missing cache just means a normal install.
      - name: Resolve Podman package versions
        id: podman-ver
        run: |
          ver=$(apt-cache policy podman netavark passt | awk '/Candidate:/{print $2}' | tr '\n' '_')
          echo "key=podman-debs-ubuntu2404-$ver" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/podman-debs
          key: ${{ steps.podman-ver.outputs.key }}
      - name: Install Podman 6
        run: |
          set -euo pipefail
          debs="$RUNNER_TEMP/podman-debs"
          sudo mkdir -p "$debs/partial"
          for attempt in 1 2 3 4; do
            sudo apt-get install -y -o Acquire::Retries=3 -o "Dir::Cache::archives=$debs" \
              podman netavark passt uidmap && break
            [ "$attempt" = 4 ] && exit 1
            sleep 15
          done
          # Keep only the .debs in the cached directory (no lock/partial, readable by the cache action).
          sudo rm -rf "$debs/partial" "$debs/lock"
          sudo chmod -R a+rX "$debs"
          podman --version
      - name: Configure rootless containers
        run: |
          set -euo pipefail
          # The alvistack package ships no /etc/containers/*.conf (measured in CI: no files,
          # Podman falls back to the default rootful graphroot). The user configuration is explicit.
          dpkg -l | grep -E 'podman|containers-common|crun|netavark|passt' || true
          ls -la /etc/containers /usr/share/containers 2>&1 || true
          mkdir -p "$HOME/.config/containers"
          cat > "$HOME/.config/containers/storage.conf" <<STORAGE
          [storage]
          driver = "overlay"
          graphroot = "$HOME/.local/share/containers/storage"
          runroot = "$XDG_RUNTIME_DIR/containers"
          STORAGE
          echo '{"default":[{"type":"insecureAcceptAnything"}]}' > "$HOME/.config/containers/policy.json"
          # The acceptance script's local registry (scripts/acceptance.sh --with-local-registry) runs over http;
          # the Podman service reads registries.conf at startup, so the entry must be there before it starts.
          cat > "$HOME/.config/containers/registries.conf" <<'REG'
          [[registry]]
          location = "127.0.0.1:15099"
          insecure = true
          REG
          podman info 2>&1 | head -40
      - name: Start rootless podman service
        run: |
          set -euo pipefail
          sock="$XDG_RUNTIME_DIR/podman/podman.sock"
          mkdir -p "$(dirname "$sock")"
          podman system service --time 0 "unix://$sock" 2>"$RUNNER_TEMP/podman-service.log" &
          for _ in $(seq 30); do [ -S "$sock" ] && break; sleep 1; done
          echo "WEGLARKA_PODMAN_SOCKET=$sock" >> "$GITHUB_ENV"
          podman version
          grep "^$USER:" /etc/subuid /etc/subgid
      - run: rustup show active-toolchain || rustup toolchain install
      # Read-only: the cache is written by the `check` job on main (same debug target).
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: check
          save-if: false
      # Without WEGLARKA_PODMAN_SOCKET the tests skip themselves — here the variable is set,
      # so `--nocapture` shows that nothing was skipped.
      - run: cargo test -p weglarka-podman -- --nocapture
      # Image smoke test (docs/decisions/0006): daemon in a container, CLI over the socket, doctor, nginx.
      # The image is assembled from the exact binaries the `musl` job built (docs/decisions/0008); no compilation here.
      - uses: actions/download-artifact@v4
        with:
          name: musl-bin
          path: bin
      - name: Build the image from the prebuilt binaries
        run: |
          set -euo pipefail
          chmod +x bin/weglarka bin/weglarka-daemon
          podman build -q -t localhost/weglarka:ci -f Containerfile --build-arg BIN_SOURCE=prebuilt .
          podman images
      - name: Image smoke test
        run: .github/scripts/smoke-image.sh localhost/weglarka:ci bin/weglarka "$WEGLARKA_PODMAN_SOCKET" scripts/acceptance.sh
      - name: Image smoke test from the quadlet arguments (no runtime.socket, hardened)
        run: .github/scripts/smoke-quadlet.sh localhost/weglarka:ci bin/weglarka bin/weglarka-daemon "$WEGLARKA_PODMAN_SOCKET"
      - name: Podman service log
        if: failure()
        run: cat "$RUNNER_TEMP/podman-service.log" || true
