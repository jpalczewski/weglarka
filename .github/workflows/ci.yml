name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -x scripts/*.sh .github/scripts/*.sh

  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - run: cargo fmt --check

  clippy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  # The generated nginx config must pass `nginx -t` on the image the daemon runs by default
  # (IngressConfig::default_nginx_image; docs/decisions/0006).
  nginx-t:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo run -q -p weglarka-ingress --example dump -- nginx > "$RUNNER_TEMP/nginx.conf"
      - run: docker run --rm -i docker.io/library/nginx:1-alpine sh -c 'cat > /tmp/n.conf && nginx -t -c /tmp/n.conf' < "$RUNNER_TEMP/nginx.conf"

  # Węglarka image (Containerfile) — the artifact goes to the smoke test in `integration-podman`.
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          tags: weglarka:ci
          provenance: false
          outputs: type=docker,dest=${{ runner.temp }}/weglarka-image.tar
          cache-from: type=gha,scope=image
          cache-to: type=gha,scope=image,mode=max
      - uses: actions/upload-artifact@v4
        with:
          name: weglarka-image
          path: ${{ runner.temp }}/weglarka-image.tar
          retention-days: 1

  musl:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - run: rustup target add x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target x86_64-unknown-linux-musl --workspace

  # Testy integracyjne z prawdziwym Podmanem 6.1 — decyzja: docs/decisions/0002-podman-in-ci.md.
  # Podman from OBS `home:alvistack` on ubuntu-24.04 (mirror of the host). The tests (session a) read
  # WEGLARKA_PODMAN_SOCKET and skip themselves when the variable is not set.
  integration-podman:
    runs-on: ubuntu-24.04
    needs: image
    steps:
      - uses: actions/checkout@v4
      - name: Install Podman 6 from OBS home:alvistack
        run: |
          set -euo pipefail
          base="https://downloadcontent.opensuse.org/repositories/home:/alvistack/xUbuntu_24.04"
          curl -fsSL "$base/Release.key" | sudo gpg --dearmor -o /usr/share/keyrings/alvistack.gpg
          echo "deb [signed-by=/usr/share/keyrings/alvistack.gpg] $base/ /" \
            | sudo tee /etc/apt/sources.list.d/alvistack.list
          # Pinning: the Podman stack only from alvistack (as on the `niechybnie` host).
          sudo tee /etc/apt/preferences.d/alvistack >/dev/null <<'PIN'
          Package: podman* netavark* aardvark-dns* conmon* crun* passt* buildah* skopeo* containers-common* golang-github-containers-*
          Pin: origin downloadcontent.opensuse.org
          Pin-Priority: 1001
          PIN
          # download.opensuse.org przekierowuje na mirrory ze starymi plikami ("unexpected size");
          # downloadcontent.opensuse.org has no mirrors. Retries just in case.
          # Runner ma preinstalowany Podman 4.9 z Ubuntu; jego golang-github-containers-common
          # koliduje plikami (/etc/containers/policy.json) z containers-common z alvistack.
          sudo apt-get purge -y podman buildah skopeo crun conmon \
            golang-github-containers-common golang-github-containers-image || true
          for attempt in 1 2 3 4; do
            sudo apt-get update
            sudo apt-get install -y -o Acquire::Retries=3 podman netavark passt uidmap && break
            [ "$attempt" = 4 ] && exit 1
            sleep 15
          done
          podman --version
      - name: Configure rootless containers
        run: |
          set -euo pipefail
          # The alvistack package ships no /etc/containers/*.conf (measured in CI: no files,
          # Podman falls back to the default rootful graphroot). The user configuration is explicit.
          dpkg -l | grep -E 'podman|containers-common|crun|netavark|passt' || true
          ls -la /etc/containers /usr/share/containers 2>&1 || true
          mkdir -p "$HOME/.config/containers"
          cat > "$HOME/.config/containers/storage.conf" <<STORAGE
          [storage]
          driver = "overlay"
          graphroot = "$HOME/.local/share/containers/storage"
          runroot = "$XDG_RUNTIME_DIR/containers"
          STORAGE
          echo '{"default":[{"type":"insecureAcceptAnything"}]}' > "$HOME/.config/containers/policy.json"
          # The acceptance script's local registry (scripts/acceptance.sh --with-local-registry) runs over http;
          # the Podman service reads registries.conf at startup, so the entry must be there before it starts.
          cat > "$HOME/.config/containers/registries.conf" <<'REG'
          [[registry]]
          location = "127.0.0.1:15099"
          insecure = true
          REG
          podman info 2>&1 | head -40
      - name: Start rootless podman service
        run: |
          set -euo pipefail
          sock="$XDG_RUNTIME_DIR/podman/podman.sock"
          mkdir -p "$(dirname "$sock")"
          podman system service --time 0 "unix://$sock" 2>"$RUNNER_TEMP/podman-service.log" &
          for _ in $(seq 30); do [ -S "$sock" ] && break; sleep 1; done
          echo "WEGLARKA_PODMAN_SOCKET=$sock" >> "$GITHUB_ENV"
          podman version
          grep "^$USER:" /etc/subuid /etc/subgid
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # Without WEGLARKA_PODMAN_SOCKET the tests skip themselves — here the variable is set,
      # so `--nocapture` shows that nothing was skipped.
      - run: cargo test -p weglarka-podman -- --nocapture
      # Image smoke test (docs/decisions/0006): daemon in a container, CLI over the socket, doctor, nginx.
      - uses: actions/download-artifact@v4
        with:
          name: weglarka-image
          path: ${{ runner.temp }}
      - name: Załaduj obraz do Podmana
        run: |
          set -euo pipefail
          # The buildx archive carries the name `weglarka:ci`; Podman may normalize it (docker.io/library/…).
          ref=$(podman load -q -i "$RUNNER_TEMP/weglarka-image.tar" | tail -1 | sed 's/^Loaded image[^:]*: //')
          podman tag "$ref" localhost/weglarka:ci
          podman images
      - run: cargo build -p weglarka-cli -p weglarka-daemon
      - name: Smoke test obrazu
        run: .github/scripts/smoke-image.sh localhost/weglarka:ci target/debug/weglarka "$WEGLARKA_PODMAN_SOCKET" scripts/acceptance.sh
      - name: Smoke test obrazu z argumentów quadletu (bez runtime.socket, z utwardzeniem)
        run: .github/scripts/smoke-quadlet.sh localhost/weglarka:ci target/debug/weglarka target/debug/weglarka-daemon "$WEGLARKA_PODMAN_SOCKET"
      - name: Podman service log
        if: failure()
        run: cat "$RUNNER_TEMP/podman-service.log" || true
