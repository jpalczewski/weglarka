name: Release

# main → ghcr.io/jpalczewski/weglarka:main + :sha-<7>; tag v* → :<version> + :latest and GitHub Release assets.
# Decisions: docs/decisions/0006-pakowanie-obrazy-i-release.md

on:
  push:
    branches: [main]
    # A docs-only push to `main` must not rebuild/republish the image: it would be identical except
    # for the revision label. Tag pushes are not affected (path filters are not evaluated for tags).
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "**/*.md"
      - ".gitignore"
    tags: ["v*"]

env:
  IMAGE: ghcr.io/jpalczewski/weglarka

jobs:
  # The image is assembled from the binaries built once in `binaries` below (also the release assets):
  # what is published is exactly what was built there, and the image job compiles nothing.
  image:
    needs: binaries
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless (GitHub OIDC)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Tag zgodny z wersją workspace
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          ver=$(awk -F'"' '/^\[workspace.package\]/{f=1;next} /^\[/{f=0} f&&/^version/{print $2}' Cargo.toml)
          [ "v$ver" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != workspace version v$ver"; exit 1; }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: raw-x86_64-unknown-linux-musl
          path: bin
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BIN_SOURCE=prebuilt
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          provenance: false
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Podpis obrazu (keyless)
        run: cosign sign --yes "$IMAGE@${{ steps.build.outputs.digest }}"
      - name: SBOM (SPDX) jako atestacja cosign
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
      - run: cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$IMAGE@${{ steps.build.outputs.digest }}"

  # Full `release` profile (docs/decisions/0008). The linux/musl leg runs on every push to main (it feeds the
  # image); the macOS leg only for tags (release asset only).
  binaries:
    strategy:
      matrix:
        include: ${{ fromJSON(startsWith(github.ref, 'refs/tags/v') && '[{"os":"ubuntu-24.04","target":"x86_64-unknown-linux-musl","packages":"-p weglarka-cli -p weglarka-daemon","files":"weglarka weglarka-daemon"},{"os":"macos-15","target":"aarch64-apple-darwin","packages":"-p weglarka-cli","files":"weglarka"}]' || '[{"os":"ubuntu-24.04","target":"x86_64-unknown-linux-musl","packages":"-p weglarka-cli -p weglarka-daemon","files":"weglarka weglarka-daemon"}]') }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup show active-toolchain || rustup toolchain install
      - run: rustup target add ${{ matrix.target }}
      - if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }} ${{ matrix.packages }}
      # Raw binaries for the image job (the very same files that go into the release tarball).
      - if: matrix.target == 'x86_64-unknown-linux-musl'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: raw-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/weglarka
            target/${{ matrix.target }}/release/weglarka-daemon
          if-no-files-found: error
          retention-days: 1
      - if: startsWith(github.ref, 'refs/tags/v')
        name: Pakowanie
        run: |
          set -euo pipefail
          name="weglarka-${GITHUB_REF_NAME#v}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          for f in ${{ matrix.files }}; do cp "target/${{ matrix.target }}/release/$f" "dist/$name/"; done
          cp LICENSE-MIT LICENSE-APACHE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bin-${{ matrix.target }}
          path: dist/*.tar.gz
          retention-days: 1

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [image, binaries]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # GitHub Release
      id-token: write # cosign sign-blob
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: bin-*
          path: dist
          merge-multiple: true
      - name: Sumy SHA-256
        working-directory: dist
        run: sha256sum ./*.tar.gz | tee SHA256SUMS
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Podpis SHA256SUMS (keyless)
        working-directory: dist
        run: cosign sign-blob --yes --output-signature SHA256SUMS.sig --output-certificate SHA256SUMS.pem SHA256SUMS
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag dist/*
