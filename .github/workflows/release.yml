name: Release

# main → ghcr.io/jpalczewski/weglarka{,-panel}:main + :sha-<7>; tag v* → :<version> + :latest and GitHub Release assets.
# Two entry points: a `v*` tag push builds everything here; on main, ci.yml calls this workflow (`workflow_call`)
# with the musl binaries its own `musl` job already built, so the image job starts right after that build and
# `binaries` is skipped (docs/decisions/0062).
# One tag publishes two images: the daemon's and the panel's (docs/decisions/0057), both at the daemon's version.
# Decisions: docs/decisions/0006-pakowanie-obrazy-i-release.md

on:
  push:
    # `v[0-9]*` is the daemon's tag only (release-plz.toml). The glob is anchored at the start of the tag name, so
    # the per-crate tags (`weglarka-panel-vX.Y.Z`, `weglarka-cli-vX.Y.Z`, ...) never start this workflow.
    tags: ["v[0-9]*"]
  workflow_call:
    inputs:
      artifact:
        description: >-
          Name of an artifact of the calling run that holds the static musl binaries (weglarka, weglarka-daemon,
          weglarka-panel). Set by ci.yml on main; empty on a tag push, where `binaries` builds them.
        type: string
        default: ""

env:
  # Same as ci.yml: RUSTFLAGS is part of rust-cache's key, so the linux leg below only shares the
  # `musl-release` entry with the CI `musl` job when the value is identical.
  RUSTFLAGS: -D warnings

jobs:
  # The image is assembled from the binaries built once in `binaries` below (also the release assets):
  # what is published is exactly what was built there, and the image job compiles nothing. One leg per image;
  # both are signed and attested the same way and carry the same version tag.
  image:
    needs: binaries
    # `binaries` is skipped when the caller supplied the artifact; a failed or cancelled build still blocks the image.
    if: ${{ !cancelled() && contains(fromJSON('["success","skipped"]'), needs.binaries.result) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ghcr.io/jpalczewski/weglarka
            file: Containerfile
          - image: ghcr.io/jpalczewski/weglarka-panel
            file: Containerfile.panel
    env:
      IMAGE: ${{ matrix.image }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless (GitHub OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag matches the weglarka-daemon version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          ver=$(awk -F'"' '/^\[package\]/{f=1;next} /^\[/{f=0} f&&/^version/{print $2}' crates/weglarka-daemon/Cargo.toml)
          [ "v$ver" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != weglarka-daemon version v$ver"; exit 1; }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact || 'raw-x86_64-unknown-linux-musl' }}
          path: bin
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BIN_SOURCE=prebuilt
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          provenance: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Podpis obrazu (keyless)
        run: cosign sign --yes "$IMAGE@${{ steps.build.outputs.digest }}"
      # Second signature, with the long-lived key the daemon can verify offline (`cosign.pub` in the
      # repository is the public half; the daemon embeds it). Keyless stays for humans. No Rekor
      # upload: the verifier needs nothing but the key and the payload (docs/decisions/0024).
      - name: Podpis obrazu kluczem statycznym (samoaktualizacja)
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${COSIGN_PRIVATE_KEY:-}" ]; then
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "::error::COSIGN_PRIVATE_KEY is not set — a release must be verifiable by the self-updater"
              exit 1
            fi
            echo "::warning::COSIGN_PRIVATE_KEY is not set — the image is not signed with the static key, self-update will refuse it"
            exit 0
          fi
          # The daemon's verifier reads the legacy `sha256-<hex>.sig` tag. Cosign 3 stores a sigstore bundle as
          # an OCI referrer by default, so ask for the legacy simple-signing layout explicitly (#316).
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY --use-signing-config=false --tlog-upload=false \
            --new-bundle-format=false --registry-referrers-mode=legacy \
            "$IMAGE@${{ steps.build.outputs.digest }}"
          # Fail the release instead of the first host: the tag the daemon fetches must exist now.
          digest="${{ steps.build.outputs.digest }}"
          docker buildx imagetools inspect "$IMAGE:${digest/:/-}.sig" > /dev/null
      - name: SBOM (SPDX) jako atestacja cosign
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
      - run: cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$IMAGE@${{ steps.build.outputs.digest }}"

  # Full `release` profile (docs/decisions/0008). Tags only: on main the very same linux/musl build is ci.yml's
  # `musl` job, whose artifact reaches `image` through `inputs.artifact`.
  binaries:
    if: ${{ inputs.artifact == '' }}
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            packages: -p weglarka-cli -p weglarka-daemon -p weglarka-panel
            files: weglarka weglarka-daemon weglarka-panel
          - os: macos-15
            target: aarch64-apple-darwin
            packages: -p weglarka-cli
            files: weglarka
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show active-toolchain || rustup toolchain install
      - run: rustup target add ${{ matrix.target }}
      - if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # The linux leg is the very same build as ci.yml's `musl` job on main (`--release` = `--profile
          # release`), so it restores that job's `musl-release` entry. CI is the only writer; a tag run only
          # reads. The macOS leg keeps its own key and is never saved either (tags are rare).
          shared-key: ${{ matrix.target == 'x86_64-unknown-linux-musl' && 'musl-release' || format('release-{0}', matrix.target) }}
          save-if: false
      - run: cargo build --release --locked --target ${{ matrix.target }} ${{ matrix.packages }}
      # Raw binaries for the image job (the very same files that go into the release tarball).
      - if: matrix.target == 'x86_64-unknown-linux-musl'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: raw-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/weglarka
            target/${{ matrix.target }}/release/weglarka-daemon
            target/${{ matrix.target }}/release/weglarka-panel
          if-no-files-found: error
          retention-days: 1
      - if: startsWith(github.ref, 'refs/tags/v')
        name: Pakowanie
        run: |
          set -euo pipefail
          name="weglarka-${GITHUB_REF_NAME#v}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          for f in ${{ matrix.files }}; do cp "target/${{ matrix.target }}/release/$f" "dist/$name/"; done
          cp LICENSE-MIT LICENSE-APACHE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-${{ matrix.target }}
          path: dist/*.tar.gz
          retention-days: 1

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [image, binaries]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # GitHub Release
      id-token: write # cosign sign-blob
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bin-*
          path: dist
          merge-multiple: true
      - name: Sumy SHA-256
        working-directory: dist
        run: sha256sum ./*.tar.gz | tee SHA256SUMS
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Podpis SHA256SUMS (keyless)
        working-directory: dist
        run: cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/release-notes.sh "$GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file notes.md --verify-tag dist/*
