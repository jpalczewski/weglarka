name: Rust debug toolchain
description: >-
  Toolchain, mold and the shared debug-build cache for the gnu CI jobs (check, nginx-e2e, podman-tests).
inputs:
  shared-key:
    description: rust-cache shared-key.
    required: true
  save-if:
    description: Whether this job writes the cache ("true"/"false").
    required: true
runs:
  using: composite
  steps:
  - name: Install mold
    shell: bash
    run: sudo apt-get install -y mold
  # A composite action cannot set job-level `env`, so the variables go through $GITHUB_ENV. This step must stay
  # before rust-cache: its key hashes these variables, and every job restoring the `check` entry has to see the
  # same values. RUSTFLAGS links the debug test binaries with mold (many test binaries, so linking matters); it
  # replaces the workflow-level value because RUSTFLAGS takes precedence over a per-target
  # CARGO_TARGET_<triple>_RUSTFLAGS. Debug info is line tables only through `[profile.dev]` in Cargo.toml.
  - name: Export the debug build environment
    shell: bash
    run: |
      {
        echo "RUSTFLAGS=-D warnings -C link-arg=-fuse-ld=mold"
      } >> "$GITHUB_ENV"
  - name: Install the pinned toolchain
    shell: bash
    run: rustup show active-toolchain || rustup toolchain install
  - uses: Swatinem/rust-cache@v2
    with:
      shared-key: ${{ inputs.shared-key }}
      save-if: ${{ inputs.save-if }}
