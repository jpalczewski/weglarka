name: Rootless Podman 6
description: >-
  Pinned Podman from OBS home:alvistack on ubuntu-24.04 (mirror of the host), installed from a cache of .debs
  (no OBS request on a hit), configured rootless, with a larger subuid pool and the libpod service listening on
  a unix socket. Decision: docs/decisions/0002-podman-in-ci.md.
outputs:
  socket:
    description: Path of the rootless Podman socket (also exported as WEGLARKA_PODMAN_SOCKET).
    value: ${{ steps.service.outputs.socket }}
runs:
  using: composite
  steps:
  # The versions are pinned here, like on the production host, and the cache key is built from these strings:
  # a bump is an explicit edit and lands as a cache miss (ADR 0002). `podman-netavark`/`podman-aardvark-dns` are
  # the OBS names of Netavark and its DNS server (Podman 6 needs 2.x); the old apt line's `netavark` resolved to
  # the Ubuntu archive's 1.4, which Podman 6 never runs, so it is gone.
  - name: Pin the Podman stack
    id: pin
    shell: bash
    run: |
      set -euo pipefail
      packages=(
        "podman=100:6.1.3-1"
        "podman-netavark=100:2.1.0-1"
        "podman-aardvark-dns=100:2.1.0-1"
        "passt=100:0.0+20261002.cba35706-1"
      )
      printf '%s\n' "${packages[@]}" > "$RUNNER_TEMP/podman-packages"
      key="podman-debs-ubuntu2404"
      for package in "${packages[@]}"; do
        version="${package#*=}"     # 100:6.1.3-1
        key="$key-${version#*:}"    # ... -> 6.1.3-1: the Debian epoch never reaches the key
      done
      # `podman --version` prints the upstream version only: 100:6.1.3-1 -> 6.1.3.
      podman_version="${packages[0]#*=}"
      podman_version="${podman_version#*:}"
      {
        echo "key=$key"
        echo "podman-version=${podman_version%%-*}"
      } >> "$GITHUB_OUTPUT"
  # Only `main` writes the cache (a pull request cannot poison it), and a hit is used from any ref.
  - name: Restore the cached .debs
    id: debs
    uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
    with:
      path: ${{ runner.temp }}/podman-debs
      key: ${{ steps.pin.outputs.key }}
  # Both paths start from the same slate. The runner ships Podman 4.9 from Ubuntu; its
  # golang-github-containers-common collides on files (/etc/containers/policy.json) with containers-common from
  # alvistack. Purging before the install also keeps crun/conmon/buildah/skopeo out of the "already installed"
  # state, so apt puts them in the cached set.
  - name: Purge the Ubuntu Podman stack
    shell: bash
    run: |
      set -euo pipefail
      # Only what is installed: `apt-get purge` rejects the whole request ("Unable to locate package") when a name
      # is neither installed nor in the package index, and the hit path never runs `apt-get update`.
      installed=()
      for package in podman buildah skopeo crun conmon \
        golang-github-containers-common golang-github-containers-image; do
        if dpkg-query -W -f='${db:Status-Abbrev}' "$package" 2>/dev/null | grep -q '^i'; then
          installed+=("$package")
        fi
      done
      if [ "${#installed[@]}" -eq 0 ]; then
        echo "the Ubuntu Podman stack is not installed"
        exit 0
      fi
      echo "purging ${installed[*]}"
      sudo apt-get purge -y "${installed[@]}"
  # The acceptance of #579: a hit installs the cached .debs with no network at all, so neither the OBS repository
  # nor its variance reaches the critical path.
  - name: Install the cached .debs (no network)
    if: steps.debs.outputs.cache-hit == 'true'
    shell: bash
    run: |
      set -euo pipefail
      debs="$RUNNER_TEMP/podman-debs"
      shopt -s nullglob
      files=("$debs"/*.deb)
      if [ "${#files[@]}" -eq 0 ]; then
        echo "::error::$debs holds no .deb although the cache matched"
        exit 1
      fi
      echo "installing ${#files[@]} cached packages"
      # One dpkg call for the whole set so dependencies inside it are unpacked before they are configured; the
      # second pass configures whatever a later argument left behind. --force-confold keeps an existing conffile
      # instead of asking (there is no tty in CI).
      sudo env DEBIAN_FRONTEND=noninteractive dpkg -i --force-confdef --force-confold "${files[@]}" \
        || sudo env DEBIAN_FRONTEND=noninteractive dpkg --configure -a
  - name: Install Podman from OBS (cache miss)
    if: steps.debs.outputs.cache-hit != 'true'
    shell: bash
    run: |
      set -euo pipefail
      base="https://downloadcontent.opensuse.org/repositories/home:/alvistack/xUbuntu_24.04"
      curl -fsSL "$base/Release.key" | sudo gpg --dearmor -o /usr/share/keyrings/alvistack.gpg
      echo "deb [signed-by=/usr/share/keyrings/alvistack.gpg] $base/ /" \
        | sudo tee /etc/apt/sources.list.d/alvistack.list
      # Pinning: the Podman stack only from alvistack (as on the production host).
      sudo tee /etc/apt/preferences.d/alvistack >/dev/null <<'PIN'
      Package: podman* netavark* aardvark-dns* conmon* crun* passt* buildah* skopeo* containers-common* golang-github-containers-*
      Pin: origin downloadcontent.opensuse.org
      Pin-Priority: 1001
      PIN
      # download.opensuse.org redirects to mirrors with stale files ("unexpected size");
      # downloadcontent.opensuse.org has no mirrors. Retries just in case.
      for attempt in 1 2 3 4; do
        sudo apt-get update && break
        [ "$attempt" = 4 ] && exit 1
        sleep 15
      done
      debs="$RUNNER_TEMP/podman-debs"
      mapfile -t packages < "$RUNNER_TEMP/podman-packages"
      sudo mkdir -p "$debs/partial"
      for attempt in 1 2 3 4; do
        sudo apt-get install -y -o Acquire::Retries=3 -o "Dir::Cache::archives=$debs" \
          "${packages[@]}" uidmap && break
        [ "$attempt" = 4 ] && exit 1
        sleep 15
      done
      # `uidmap` (newuidmap/newgidmap, needed by rootless Podman) comes from the Ubuntu archive and is usually
      # already installed, so apt leaves it out of the cache; the hit path has no network and needs the .deb.
      ( cd "$debs" && sudo apt-get download -q uidmap )
      # Keep only the .debs in the cached directory (no lock/partial, readable by the cache action).
      sudo rm -rf "$debs/partial" "$debs/lock"
      sudo chmod -R a+rX "$debs"
  - name: Check the pinned version
    shell: bash
    env:
      WANT: ${{ steps.pin.outputs.podman-version }}
    run: |
      set -euo pipefail
      got=$(podman --version)
      echo "$got"
      if [ "$got" != "podman version $WANT" ]; then
        echo "::error::'$got' is not the pinned 'podman version $WANT'"
        exit 1
      fi
  - name: Save the .debs (main only)
    if: steps.debs.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
    uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
    with:
      path: ${{ runner.temp }}/podman-debs
      key: ${{ steps.pin.outputs.key }}
  - name: Configure rootless containers
    shell: bash
    run: |
      set -euo pipefail
      # The alvistack package ships no /etc/containers/*.conf (measured in CI: no files,
      # Podman falls back to the default rootful graphroot). The user configuration is explicit.
      dpkg -l | grep -E 'podman|containers-common|crun|netavark|passt' || true
      ls -la /etc/containers /usr/share/containers 2>&1 || true
      mkdir -p "$HOME/.config/containers"
      cat > "$HOME/.config/containers/storage.conf" <<STORAGE
      [storage]
      driver = "overlay"
      graphroot = "$HOME/.local/share/containers/storage"
      runroot = "$XDG_RUNTIME_DIR/containers"
      STORAGE
      echo '{"default":[{"type":"insecureAcceptAnything"}]}' > "$HOME/.config/containers/policy.json"
      # The acceptance script's local registry (scripts/acceptance.sh --with-local-registry) runs over http;
      # the Podman service reads registries.conf at startup, so the entry must be there before it starts.
      cat > "$HOME/.config/containers/registries.conf" <<'REG'
      [[registry]]
      location = "127.0.0.1:15099"
      insecure = true
      REG
      podman info 2>&1 | head -40
  - name: Larger subuid pool
    shell: bash
    run: |
      set -euo pipefail
      # Each Węglarka instance takes a 65 536-uid range and the CI user has exactly 65 536 subuids
      # (docs/decisions/0009). Production has 2 000 000; mirror that order of magnitude here.
      sudo usermod --add-subuids 1000000-1999999 --add-subgids 1000000-1999999 "$USER"
      grep "^$USER:" /etc/subuid /etc/subgid
      # `podman info` in the previous step created the rootless user namespace (pause process) with the
      # old pool; migrate restarts it so the new subuids are mapped.
      podman system migrate
      podman info --format '{{json .Host.IDMappings.UIDMap}}'
  - name: Start rootless podman service
    id: service
    shell: bash
    run: |
      set -euo pipefail
      sock="$XDG_RUNTIME_DIR/podman/podman.sock"
      mkdir -p "$(dirname "$sock")"
      podman system service --time 0 "unix://$sock" 2>"$RUNNER_TEMP/podman-service.log" &
      for _ in $(seq 30); do [ -S "$sock" ] && break; sleep 1; done
      echo "socket=$sock" >> "$GITHUB_OUTPUT"
      # Also exported to the later steps of the calling job (the Podman tests skip themselves without it).
      echo "WEGLARKA_PODMAN_SOCKET=$sock" >> "$GITHUB_ENV"
      podman version
      grep "^$USER:" /etc/subuid /etc/subgid
