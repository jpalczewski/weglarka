[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jpalczewski/weglarka"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
# internal (docs/decisions/0015, amendment). `version = "0.0"` is matched by every 0.0.x release, so a bump of
# the crate never makes release-plz rewrite — and therefore bump — its dependents. The exception is
# `weglarka-api`, the CLI/daemon contract: its requirement is the exact current version on purpose, so every
# release of the contract releases its consumers (`weglarka-cli`, `weglarka-daemon`).
weglarka-acme = { path = "crates/weglarka-acme", version = "0.0" }
weglarka-api = { path = "crates/weglarka-api", version = "0.0.3" }
weglarka-dns = { path = "crates/weglarka-dns", version = "0.0" }
weglarka-engine = { path = "crates/weglarka-engine", version = "0.0" }
weglarka-podman = { path = "crates/weglarka-podman", version = "0.0" }
weglarka-ingress = { path = "crates/weglarka-ingress", version = "0.0" }
weglarka-identity = { path = "crates/weglarka-identity", version = "0.0" }
weglarka-http = { path = "crates/weglarka-http", version = "0.0" }
weglarka-model = { path = "crates/weglarka-model", version = "0.0" }
weglarka-notify = { path = "crates/weglarka-notify", version = "0.0" }
weglarka-registry = { path = "crates/weglarka-registry", version = "0.0" }

# external
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "matched-path"] }
base64 = "0.22"
# No `color` (anstream and friends): plain help output is enough for a CLI run over SSH.
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
# Static-site release extraction (docs/decisions/0049): pure-Rust inflate, no C toolchain.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
bytes = "1"
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hex = "0.4"
hmac = "0.13"
http-body-util = "0.1"
# ACME client (docs/decisions/0038): `ring` provider only — the default `aws-lc-rs` needs a C toolchain.
instant-acme = { version = "0.8", default-features = false, features = ["ring", "hyper-rustls", "rcgen", "x509-parser"] }
# TLS connector for the ACME client: `ring` + our own bundled roots (the image has no CA store).
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "tls12", "ring"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "tokio", "http1"] }
insta = { version = "1", features = ["json"] }
# Outbound HTTP (docs/decisions/0021, #219): `rustls-no-provider` + our own `ring` config via
# `use_preconfigured_tls` (reqwest 0.13 has no webpki-roots feature); never default-tls/aws-lc/native-tls.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
# TLS for outbound notifications: `ring` (no C toolchain beyond `cc`, no OpenSSL) and bundled roots,
# because the daemon image is `scratch` and has no CA store (docs/decisions/0021).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# Signature verification of the self-update image (ECDSA P-256, docs/decisions/0024) — the same provider
# rustls uses, so pinning it directly adds no crypto implementation to the binary.
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
# No `xattr` (pulls in rustix): extraction never restores extended attributes.
tar = { version = "0.4", default-features = false }
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
# Only to name `url::ParseError` (the type behind `reqwest::Url`); already in the graph via reqwest.
url = { version = "2", default-features = false }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
toml = "1"
# No `attributes` (`#[instrument]`, pulls in syn 2): only the logging macros are used.
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", features = ["json"] }
webpki-roots = "1"
# Reads `notAfter` from issued chains (no verification features, so no extra crypto).
x509-parser = "0.18"

# Line tables keep backtraces readable at a fraction of full debug info (2.5-3x smaller targets);
# `CARGO_PROFILE_DEV_DEBUG=full` brings variables back for a debugger session.
[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
opt-level = "z"

# Pull-request builds (docs/decisions/0008): same code, much cheaper to link; `main` and tags use `release`.
[profile.ci]
inherits = "release"
lto = "thin"
codegen-units = 16
