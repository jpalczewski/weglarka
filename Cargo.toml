[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jpalczewski/weglarka"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
# internal
weglarka-api = { path = "crates/weglarka-api", version = "0.0.1" }
weglarka-core = { path = "crates/weglarka-core", version = "0.0.1" }
weglarka-podman = { path = "crates/weglarka-podman", version = "0.0.1" }
weglarka-ingress = { path = "crates/weglarka-ingress", version = "0.0.1" }

# external
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
clap = { version = "4", features = ["derive"] }
bytes = "1"
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hex = "0.4"
hmac = "0.13"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "tokio", "http1"] }
insta = { version = "1", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
opt-level = "z"

# Pull-request builds (docs/decisions/0008): same code, much cheaper to link; `main` and tags use `release`.
[profile.ci]
inherits = "release"
lto = "thin"
codegen-units = 16
