{% for r in rows %}<div class="line access"><time>{{ r.time }}</time> <span class="method">{{ r.method }}</span> <span class="path">{{ r.path }}</span> <span class="badge badge-{{ r.class }}">{{ r.status }}</span> <span class="num">{{ r.bytes }} B</span> <span class="num">{{ r.request_time }}</span> <span class="addr">{{ r.remote }}</span> <span class="agent">{{ r.user_agent }}</span></div>{% endfor %}
