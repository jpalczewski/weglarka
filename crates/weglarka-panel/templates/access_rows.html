{% for r in rows %}<div class="line access"><time>{{ r.time }}</time> <span class="method">{{ r.method }}</span> <span class="path">{{ r.path }}</span> <span class="badge badge-{{ r.class }}">{{ r.status }}</span>{% if !r.upstream_status.is_empty() %} <span class="num muted" title="upstream status: what the app answered per attempt; nginx when the app never answered">{{ r.upstream_status }}</span>{% endif %} <span class="num">{{ r.bytes }} B</span> <span class="num" title="time to the app's response headers; - when it did not answer">{{ r.upstream_header_time }}</span> <span class="num">{{ r.request_time }}</span> <span class="addr">{{ r.remote }}</span> <span class="agent">{{ r.user_agent }}</span></div>{% endfor %}
