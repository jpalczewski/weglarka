[package]
name = "weglarka-acme"
description = "Węglarka: ACME certificate issuance and renewal for the edge ingress (challenge solvers, cert store, renewal policy)"
version = "0.0.4"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# In-memory `AcmeClient`/`CertInspector` for engine and daemon tests — no network, no CA.
testing = []

[dependencies]
base64.workspace = true
hyper-rustls.workspace = true
hyper-util.workspace = true
instant-acme.workspace = true
rustls.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
tracing.workspace = true
webpki-roots.workspace = true
weglarka-model.workspace = true
weglarka-dns.workspace = true
x509-parser.workspace = true

[dev-dependencies]
tempfile.workspace = true
weglarka-dns = { workspace = true, features = ["testing"] }
tokio.workspace = true
