[package]
name = "weglarka-registry"
description = "Węglarka: OCI registry lookups for cosign signatures and their verification"
version = "0.0.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# In-memory `Registry` and a helper that signs payloads with a throw-away key — for daemon tests.
testing = []

[dependencies]
base64.workspace = true
ring.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
url.workspace = true
weglarka-http.workspace = true
weglarka-model.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["net", "io-util", "time", "test-util", "rt-multi-thread"] }
