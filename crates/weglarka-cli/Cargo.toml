[package]
name = "weglarka-cli"
description = "Węglarka: CLI (cienki klient admin API + doctor --preflight)"
version = "0.0.4"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "weglarka"
path = "src/main.rs"

[dependencies]
clap = { workspace = true, features = ["env"] }
futures-util.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "net", "io-util", "io-std", "fs", "macros", "time", "process", "signal"] }
toml.workspace = true
weglarka-api.workspace = true
weglarka-engine.workspace = true
weglarka-model.workspace = true

[dev-dependencies]
hyper = { workspace = true, features = ["server"] }
insta.workspace = true
