[package]
name = "weglarka-engine"
description = "Węglarka: reconcile loop, deploy flow, volumes and the Platform trait, on top of weglarka-model"
version = "0.0.5"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# In-memory fake `PodmanClient` — for the engine's own tests and the daemon's.
testing = []

[dependencies]
bytes.workspace = true
flate2.workspace = true
futures-core.workspace = true
futures-util.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
weglarka-model.workspace = true

[dev-dependencies]
insta.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
weglarka-engine = { path = ".", features = ["testing"] }
# The libpod integration tests (`tests/`) drive the engine against a real Podman.
weglarka-podman.workspace = true
