[package]
name = "weglarka-dns"
description = "Węglarka: DNS-provider adapters for ACME DNS-01 (trait + Cloudflare)"
version = "0.0.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

